[project]
name = "sommelier"
version = "0.1.0"
description = "Train engineering judgment through blind side-by-side code comparison."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "typer>=0.15",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[project.scripts]
sommelier = "sommelier.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "rust-just>=1.38",
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sommelier"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["e2e: browser smoke test (needs built frontend + playwright browsers)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
src = ["backend"]
target-version = "py312"
extend-exclude = ["frontend", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["backend/sommelier"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
